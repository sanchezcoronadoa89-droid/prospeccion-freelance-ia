services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: prospeccion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: prospeccion
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospeccion -d prospeccion"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
